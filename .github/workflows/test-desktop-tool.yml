name: Desktop tool tests
on:
  pull_request:
    paths:
      - "desktop-tool/**"
  workflow_dispatch:
jobs:
  test:
    name: Desktop tool tests
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    #          - os: ubuntu-latest  # https://github.com/browser-actions/setup-edge/issues/516
    steps:
      - uses: actions/checkout@v6
      - name: Run desktop tool tests
        if: env.GOOGLE_DRIVE_API_KEY != ''
        uses: ./.github/actions/test-desktop-tool
        with:
          google-drive-api-key: ${{ env.GOOGLE_DRIVE_API_KEY }}
      - name: Skip secret-backed tests for fork pull requests
        if: env.GOOGLE_DRIVE_API_KEY == ''
        run: echo "::notice::Desktop tool tests require GOOGLE_DRIVE_API_KEY, which is unavailable to fork pull requests."
