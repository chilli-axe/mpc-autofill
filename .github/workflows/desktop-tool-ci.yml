name: Desktop tool CI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching the published tag (for example, 4.7.0)
        required: true
        type: string
jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      MPC_AUTOFILL_RELEASE_CHECKS: "1"
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-desktop-tool
        with:
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
  build:
    name: Build
    needs: [test]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-tool
    strategy:
      matrix:
        include:
          - os: macos-latest
            FILENAME: autofill-macos-arm.command
            TARGET: macos-arm
            MACOS_ARCH: arm64
          - os: macos-15-intel
            TARGET: macos-intel
            FILENAME: autofill-macos-intel.command
            MACOS_ARCH: x86_64
          - os: windows-latest
            FILENAME: autofill-windows.exe
            TARGET: windows
            MACOS_ARCH: ""
          - os: ubuntu-22.04 # Build against glibc 2.35 so the bundle runs on Debian 12.
            FILENAME: autofill-linux.bin
            TARGET: linux
            MACOS_ARCH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-tool
        with:
          group: build
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}

      # setup macOS runners for signing and notarisation
      # retrieved from https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications#add-a-step-to-your-workflow
      - name: Install the Apple certificate and notarisation profile
        if: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
        env:
          MACOS_SIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGN_CERTIFICATE_BASE64 }}
          MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          NOTARY_KEY_PATH=$RUNNER_TEMP/build_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$MACOS_SIGN_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$MACOS_NOTARY_KEY_BASE64" | base64 --decode -o $NOTARY_KEY_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$MACOS_SIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # create notarisation profile
          xcrun notarytool store-credentials "${{ secrets.MACOS_NOTARY_PROFILE_NAME }}" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "${{ secrets.MACOS_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.MACOS_NOTARY_ISSUER_ID }}" \
            --keychain $KEYCHAIN_PATH

      - uses: ./.github/actions/build-desktop-tool
        with:
          filename: ${{ matrix.FILENAME }}
          version: ${{ inputs.version }}
          macos-arch: ${{ matrix.MACOS_ARCH }}
          product-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.TARGET }}
          sign: "true"
          sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
          keyring-file: ${{ runner.temp }}/app-signing.keychain-db
          keyring-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          app-name: com.ndepaola.mpc-autofill-${{ matrix.TARGET }}
      - name: Smoke test bundled identity and TLS
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          test "$(./build/${{ matrix.FILENAME }} --version)" = "MPC Autofill $RELEASE_VERSION ($RELEASE_REPOSITORY)"
          env -u SSL_CERT_FILE -u SSL_CERT_DIR ./build/${{ matrix.FILENAME }} --check-tls
      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.TARGET }} Unsigned Build
          path: |
            desktop-tool/build/${{ matrix.FILENAME }}

      # notarise macOS executables
      - name: Notarise macOS executable
        id: submit-notarisation-request
        if: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
        run: |
          # create a zip archive suitable for notarization
          /usr/bin/ditto -c -k "build/${{ matrix.FILENAME }}" "build/compressed.zip"

          # invoke notarytool
          xcrun notarytool submit "build/compressed.zip" --keychain-profile ${{ secrets.MACOS_NOTARY_PROFILE_NAME }} --wait --output-format json > build/notarization.json
          python -c "import json; assert json.load(open('build/notarization.json'))['status'] == 'Accepted'"
          codesign --verify --strict --verbose=2 "build/${{ matrix.FILENAME }}"

      # sign Windows executables with SignPath
      - name: Sign Windows executable with SignPath
        if: ${{ matrix.TARGET == 'windows' }}
        id: submit-signing-request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "061f342a-ba1a-404b-b7f8-e08c8f6d9792"
          project-slug: "mpc-autofill"
          signing-policy-slug: "release-signing"
          github-artifact-id: "${{ steps.upload-unsigned-artifact.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: desktop-tool/build/
      - name: Verify signed Windows executable
        if: matrix.TARGET == 'windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "build/${{ matrix.FILENAME }}"
          if ($signature.Status -ne 'Valid') { throw "Invalid executable signature: $($signature.Status)" }
          & "./build/${{ matrix.FILENAME }}" --check-tls
          if ($LASTEXITCODE -ne 0) { throw "Signed executable TLS check failed" }
          & "./build/${{ matrix.FILENAME }}" --help
          if ($LASTEXITCODE -ne 0) { throw "Signed executable help check failed" }
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
      - name: Upload signed artifact to GitHub
        if: ${{ matrix.TARGET == 'windows' }}
        id: upload-signed-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.TARGET }} Signed Build
          path: |
            desktop-tool/build/${{ matrix.FILENAME }}
