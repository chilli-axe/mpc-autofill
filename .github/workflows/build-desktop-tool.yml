name: Desktop tool Windows CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-desktop-tool
        with:
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}

  build:
    name: Build on Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tool
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install imageio
      - name: Require Google Drive API credentials
        shell: pwsh
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          if (-not $env:GOOGLE_DRIVE_API_KEY) {
            throw "Add desktop-tool/client_secrets.json as the GOOGLE_DRIVE_API_KEY repository secret."
          }
      - name: Write Google Drive API credentials to file
        uses: jsdaniell/create-json@v1.2.3
        with:
          name: client_secrets.json
          json: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          dir: desktop-tool/
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: desktop-tool
          script-name: autofill.py
          mode: onefile
          output-file: autofill-windows.exe
      - name: Smoke test bundled executable
        run: .\build\autofill-windows.exe --help
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows Unsigned Build
          path: desktop-tool/build/autofill-windows.exe
