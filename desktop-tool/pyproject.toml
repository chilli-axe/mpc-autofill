[project]
name = "mpc-autofill-desktop"
version = "1.2.4"
requires-python = ">=3.14,<3.15"
dependencies = [
    "attrs==26.1.0",
    "blessed==1.21.0", # Newer terminal probes stall startup when capability replies are unavailable.
    "certifi==2026.10.23",
    "click==8.5.0",
    "defusedxml==0.7.1",
    "enlighten==1.11.2", # 1.14.1 blocks Windows progress updates on cursor-position queries.
    "fpdf2==2.8.9",
    "google-api-python-client==2.201.0",
    "google-auth==2.62.0",
    "InquirerPy==0.3.4",
    "pillow==13.0.0",
    "ratelimit==2.2.1",
    "requests==2.34.2",
    "sanitize-filename==1.2.0",
    "selenium==4.51.0",
    "setuptools==84.2.1", # undetected-chromedriver still needs its distutils shim.
    "undetected-chromedriver==3.5.5",
    "wakepy==1.0.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage==7.17.0",
    "isort==9.0.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pexpect==4.9.0; sys_platform != 'win32'",
    "pywinpty==3.0.3; sys_platform == 'win32'",
    "pytest-retry==1.7.0",
    "ruff==0.17.2",
    "types-requests",
]
build = ["nuitka==4.3.1", "imageio==2.38.1"]

[tool.uv]
package = false
required-version = "==0.13.5"
build-constraint-dependencies = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
known_src = "src"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "SRC", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["build", "dist", "cards", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["build", "dist", "cards"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "__init__.py" = ["E402", "F403"] }

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_missing_imports = true
implicit_reexport = false
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
exclude = "tests/|build/|dist/|\\.venv/"

# InquirerPy's public API intentionally re-exports these names without aliases.
[[tool.mypy.overrides]]
module = ["InquirerPy", "InquirerPy.inquirer"]
implicit_reexport = true
